<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found - LessonAI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#1f5fff;--navy:#0b1b4d;--ink:#10224f;--muted:#5b6788;--bg:#f4f7ff;--line:#e3e9f8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;color:var(--ink);background:var(--bg);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;}
.error-box{background:#fff;padding:60px 40px;border-radius:24px;box-shadow:0 15px 40px rgba(31,63,160,.08);border:1px solid var(--line);max-width:500px;width:90%;}
h1{font-size:100px;color:var(--blue);font-weight:800;line-height:1;margin-bottom:20px;}
h2{font-size:24px;color:var(--navy);margin-bottom:15px;}
p{color:var(--muted);margin-bottom:30px;}
.btn{display:inline-block;background:var(--blue);color:#fff;padding:14px 30px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;transition:.2s;}
.btn:hover{background:#0f4ae0; transform:translateY(-2px); box-shadow:0 8px 20px rgba(31,95,255,.3);}
</style>
</head>
<body>

<div class="error-box">
  <h1>404</h1>
  <h2>Oops! Page Not Found</h2>
  <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
  <a href="index.html" class="btn">Go Back to Home</a>
</div>

</body>
</html>
